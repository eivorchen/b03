<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <meta name="description" content="用四次测量，寻找隐藏的模拟信号源。核能文化节 · 信号寻踪。">
  <title>信号寻踪 · B03</title>
  <style>body{margin:0;background:#f5f3eb;color:#233b36;font-family:system-ui,sans-serif}#loading{max-width:32rem;margin:20vh auto;padding:2rem}#loading button{padding:1rem;border:1px solid;border-radius:8px;background:transparent;font:inherit}[hidden]{display:none!important}</style>
  <link id="theme-style" rel="stylesheet" href="./styles.css?v=0.3.0" onload="this.dataset.loaded='true'" onerror="this.dataset.failed='true'">
</head>
<body>
  <div id="loading" role="status"><h1>信号寻踪</h1><p id="loading-message">正在准备探测设备…</p><button id="retry-load" hidden>重新加载</button></div>
  <div id="app" hidden></div>
  <noscript>请启用 JavaScript 后重新打开。游戏在浏览器本地运行，无需登录。</noscript>
  <script type="module">
    const loading = document.querySelector('#loading');
    const message = document.querySelector('#loading-message');
    const retry = document.querySelector('#retry-load');
    retry.onclick = () => location.reload();
    const style = document.querySelector('#theme-style');
    let bootTimeout;
    try {
      await Promise.race([Promise.all([
        style.dataset.failed ? Promise.reject(new Error('style')) : style.dataset.loaded ? Promise.resolve() : new Promise((resolve, reject) => {
          style.addEventListener('load', resolve, { once: true });
          style.addEventListener('error', () => reject(new Error('style')), { once: true });
          setTimeout(() => style.sheet ? resolve() : reject(new Error('style timeout')), 8000);
        }),
        import('./src/app.js?v=0.3.0')
      ]), new Promise((resolve, reject) => {
        bootTimeout = setTimeout(() => reject(new Error('resource timeout')), 12000);
      })]);
      loading.hidden = true;
      document.querySelector('#app').hidden = false;
    } catch {
      message.textContent = '资源暂时未能加载。请检查网络后重试，或请工作人员提供备用设备。';
      retry.hidden = false;
    } finally {
      clearTimeout(bootTimeout);
    }
  </script>
</body>
</html>
